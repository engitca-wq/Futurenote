name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        env:
          FN_KEYSTORE: ${{ github.workspace }}/android/app/signing/test-signing.jks
          FN_KEYSTORE_PASSWORD: futurenote-test
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/futurenote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: futurenote-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: FUTURENOTE test build
          prerelease: true
          make_latest: false
          body: Latest test APK built from ${{ github.ref_name }} (${{ github.sha }}).
          files: build/app/outputs/flutter-apk/futurenote.apk
